<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ScanMyFrame · Admin UI Kit</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/favicon.svg">
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  body { margin: 0; background: var(--bg); color: var(--fg-body); font-family: var(--font-body); }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root" data-screen-label="Admin console"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="PostsTab.jsx"></script>
<script type="text/babel" src="UsersTab.jsx"></script>
<script type="text/babel" src="NewsletterTab.jsx"></script>
<script type="text/babel" src="NotificationsTab.jsx"></script>

<script type="text/babel">
const { useState } = React;

function App() {
  const [authed, setAuthed] = useState(true);
  const [tab, setTab] = useState('posts');

  if (!authed) return <LoginScreen onLogin={() => setAuthed(true)} />;

  return (
    <AdminShell tab={tab} onTab={setTab} onSignOut={() => setAuthed(false)}>
      {tab === 'posts' && <PostsTab onNew={() => {}} onEdit={() => {}} />}
      {tab === 'users' && <UsersTab />}
      {tab === 'newsletter' && <NewsletterTab />}
      {tab === 'notifications' && <NotificationsTab />}
    </AdminShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
